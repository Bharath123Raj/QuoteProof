name: Tests and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build portable app
        run: npm run build
      - name: Run offline tests
        run: npm test
      - name: Validate deployment module
        run: npm run validate
      - name: Verify assembled source is committed
        run: git diff --exit-code -- worker/index.js
